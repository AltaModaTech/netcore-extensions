name: .NET CICD

on:
  push:
    branches: ['**']  # build, test
    tags: ['v*']      # build, test, publish
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # File locking behaves differently on Unix and Windows (ai/spec.md REQ-CI-1).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore netcore-extensions.slnx

      - name: Build
        run: dotnet build netcore-extensions.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution netcore-extensions.slnx --configuration Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack netcore-extensions.slnx --configuration Release --no-build --output artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 2
          if-no-files-found: error

  # Publishes the packages built above to nuget.org on v* tags, with a short-lived key from
  # nuget.org Trusted Publishing (ai/spec.md REQ-CI-2). The policy names this workflow file.
  publish:
    name: Publish to nuget.org
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Verify the package versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version: $version"
          for package in artifacts/*.nupkg; do
            case "$package" in
              *".$version.nupkg") ;;
              *) echo "::error::$package does not match tag version $version"; exit 1 ;;
            esac
          done

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}  # the nuget.org profile name that owns the Trusted Publishing policy

      # Use .NET 11 to get nuget staging support
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Push NuGet packages
        run: |
          for package in artifacts/*.nupkg; do
            dotnet package stage push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --group netcore-extensions \
              --source https://api.nuget.org/v3/index.json
          done
