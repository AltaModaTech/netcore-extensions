name: Publish NuGet Package

on:
  push:
    tags:
    - 'v*'

jobs:
  build-and-publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.*

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: |
        dotnet test --configuration Release --no-restore --verbosity normal ./Test.AMT.Extensions.System/Test.AMT.Extensions.System.csproj
        dotnet test --configuration Release --no-restore --verbosity normal ./Test.AMT.Extensions.Linq/Test.AMT.Extensions.Linq.csproj
    # NOTE: does not test /Test.AMT.Extensions.Logging at GitHub b/c fails w/IP port comms.

    - name: Pack
      run: dotnet pack ./netcore-extensions.slnx --configuration Release --no-build --output artifacts
      # building the slnx should build a package per csproj with IsPackable=true


    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER_NAME }}   # nuget.org username (profile name), NOT your email address
        
    # Push the package
    - name: NuGet push
      run: |
        dotnet nuget push artifacts/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json